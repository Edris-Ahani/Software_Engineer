<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Persistent task board</title><link rel="stylesheet" href="../../assets/base.css"><style></style></head>
<body><header><a href="../../">Lab home</a><h1>Persistent task board</h1></header><main>
<form id="add"><label for="title">Task title</label> <input id="title" required maxlength="120"><button>Add task</button></form>
<p role="status" id="status"></p><p id="summary"></p><ul id="tasks"></ul>
<button id="reset" type="button" hidden>Discard unreadable saved data and reset</button></main>
<script type="module">
import { taskReducer, decodeTasks, encodeTasks } from "../../lib/tasks.mjs";
const key = "frontend-board-v1";
const form = document.querySelector("#add");
const input = document.querySelector("#title");
const status = document.querySelector("#status");
const list = document.querySelector("#tasks");
const reset = document.querySelector("#reset");
let tasks = []; let canPersist = true;
try { tasks = decodeTasks(localStorage.getItem(key)); status.textContent = "Tasks ready"; }
catch { canPersist = false; reset.hidden = false; status.textContent = "Saved data unavailable. Working in memory; saved data will not be overwritten until reset."; }

function render(focusId, action) {
  list.replaceChildren(...tasks.map(task => {
    const li = document.createElement("li"); li.dataset.id = task.id;
    const text = document.createElement("span"); text.textContent = task.title + (task.done ? " (done) " : " (open) ");
    const toggle = document.createElement("button"); toggle.type = "button"; toggle.dataset.action = "toggle";
    toggle.textContent = task.done ? "Reopen" : "Complete"; toggle.setAttribute("aria-label", toggle.textContent + " " + task.title);
    const remove = document.createElement("button"); remove.type = "button"; remove.dataset.action = "remove";
    remove.textContent = "Remove"; remove.setAttribute("aria-label", "Remove " + task.title);
    li.append(text, toggle, " ", remove); return li;
  }));
  document.querySelector("#summary").textContent = tasks.filter(task => task.done).length + " of " + tasks.length + " completed";
  if (focusId) {
    const target = [...list.children].find(li => li.dataset.id === focusId)?.querySelector('[data-action="' + action + '"]');
    if (target) target.focus(); else input.focus();
  }
}
function apply(action) {
  try { tasks = taskReducer(tasks, action); }
  catch (error) { status.textContent = error.message; return false; }
  if (canPersist) {
    try { localStorage.setItem(key, encodeTasks(tasks)); status.textContent = "Tasks saved"; }
    catch { status.textContent = "Save failed. Changes remain only in this visit until a later successful save."; }
  } else status.textContent = "Changed in memory only. Saved data remains untouched.";
  render(action.type === "toggle" ? action.id : undefined, "toggle");
  return true;
}
form.onsubmit = event => {
  event.preventDefault();
  if (apply({ type: "add", id: crypto.randomUUID(), title: input.value })) { form.reset(); input.focus(); }
};
list.onclick = event => {
  const button = event.target.closest("button");
  if (!button || !list.contains(button)) return;
  const action = { type: button.dataset.action, id: button.closest("li").dataset.id };
  if (apply(action) && action.type === "remove") input.focus();
};
reset.onclick = () => {
  try {
    localStorage.removeItem(key); canPersist = true; tasks = []; reset.hidden = true; render();
    status.textContent = "Saved data discarded. Start a new task list."; input.focus();
  } catch { status.textContent = "Reset unavailable. Working in memory."; }
};
render();
</script></body></html>
