user nginx;
worker_processes auto;
error_log /dev/stderr warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;
    sendfile on;
    server_tokens off;

    log_format lab escape=json
        '{"time":"$time_iso8601","id":"$request_id",'
        '"client":"$remote_addr","method":"$request_method",'
        '"uri":"$uri","status":"$status",'
        '"request_time":"$request_time",'
        '"upstream":"$upstream_addr","upstream_status":"$upstream_status",'
        '"upstream_time":"$upstream_response_time",'
        '"cache":"$upstream_cache_status"}';
    access_log /dev/stdout lab;

    upstream demo_backends {
        zone demo_backends 64k;
        server app1:8000 max_fails=1 fail_timeout=5s;
        server app2:8000 max_fails=1 fail_timeout=5s;
        keepalive 8;
    }

    proxy_cache_path /var/cache/nginx/lab levels=1:2
        keys_zone=lab_cache:10m max_size=50m inactive=5m;
    map $http_authorization $has_auth { default 1; "" 0; }
    map $http_cookie $has_cookie { default 1; "" 0; }
    limit_req_zone $binary_remote_addr zone=lab_rate:10m rate=2r/s;

    server {
        listen 80 default_server;
        server_name localhost;
        root /usr/share/nginx/html;
        index index.html;
        autoindex off;
        client_max_body_size 1m;

        include /etc/nginx/proxy_headers.conf;
        proxy_connect_timeout 2s;
        proxy_read_timeout 10s;
        proxy_next_upstream error timeout http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Request-ID $request_id always;

        location = /healthz {
            default_type text/plain;
            return 200 "ok\n";
        }

        location ^~ /assets/ {
            try_files $uri =404;
        }

        location /api/ {
            proxy_pass http://demo_backends/;
        }

        location /preserve/ {
            proxy_pass http://demo_backends;
        }

        location /cache/ {
            proxy_pass http://demo_backends/;
            proxy_cache lab_cache;
            proxy_cache_key "$scheme|$host|$proxy_host|$request_uri";
            proxy_cache_valid 200 30s;
            proxy_cache_lock on;
            proxy_cache_bypass $has_auth $has_cookie;
            proxy_no_cache $has_auth $has_cookie;
            # Repeat parent response headers: this scope defines add_header.
            add_header X-Content-Type-Options nosniff always;
            add_header X-Request-ID $request_id always;
            add_header X-Cache-Status $upstream_cache_status always;
        }

        location /limited/ {
            limit_req zone=lab_rate burst=2 nodelay;
            limit_req_status 429;
            proxy_pass http://demo_backends/;
        }

        location /events/ {
            proxy_pass http://demo_backends;
            proxy_buffering off;
            proxy_cache off;
            gzip off;
        }

        location = /old-docs { return 302 /docs/; }
        location = /docs/ {
            default_type text/plain;
            return 200 "Nginx lab documentation route\n";
        }
        location / { try_files $uri $uri/ =404; }
    }
}
