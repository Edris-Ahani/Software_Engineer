name: software-engineer-nginx-lab

services:
  nginx:
    image: nginx:stable-alpine
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./proxy_headers.conf:/etc/nginx/proxy_headers.conf:ro
      - ./html:/usr/share/nginx/html:ro
    depends_on:
      app1:
        condition: service_healthy
      app2:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10

  app1:
    image: python:3.13-alpine
    command: ["python", "-u", "/app/backend.py"]
    environment:
      BACKEND_NAME: app1
      BACKEND_PORT: "8000"
    volumes:
      - ./backend.py:/app/backend.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 10

  app2:
    image: python:3.13-alpine
    command: ["python", "-u", "/app/backend.py"]
    environment:
      BACKEND_NAME: app2
      BACKEND_PORT: "8000"
    volumes:
      - ./backend.py:/app/backend.py:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=2).read()"]
      interval: 3s
      timeout: 3s
      retries: 10
